# Quiet by design: ready pull requests in this organization merge themselves
# and a merge to main deploys. One grouped minor/patch pull request per
# ecosystem each month; major versions are upgraded by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Pinned with deploy/viewer-release.json; upgraded through its reviewed lane.
      - dependency-name: "@subcult/archive-viewer"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directories:
      - /
      - /deploy
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
