name: Mirror CI
run-name: Mirror CI ${{ github.sha }}
'on':
  push:
    branches-ignore:
    - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
    - name: Install job-local pnpm
      id: pnpm
      shell: bash
      run: |
        set -euo pipefail
        tool_dir="$RUNNER_TEMP/pnpm-tool"
        npm install --prefix "$tool_dir" pnpm@10.33.0
        echo "$tool_dir/node_modules/.bin" >> "$GITHUB_PATH"
        echo "store=$("$tool_dir/node_modules/.bin/pnpm" store path --silent)" >> "$GITHUB_OUTPUT"
    - name: Restore the pnpm store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm.outputs.store }}
        key: pnpm-store-v1-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
    - name: Run canonical verification
      run: make verify
    if: github.repository == 'subculture-collective/democracy-now-tv'
  image:
    name: Frontend image build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Build the deployable frontend image without publishing it
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        auth_dir=$(mktemp -d)
        trap 'rm -rf "$auth_dir"' EXIT
        export DOCKER_BUILDKIT=1
        # Public package registry only; no credential is involved.
        printf '%s\n' '@subcult:registry=https://git.subcult.tv/api/packages/subculture-collective/npm/' > "$auth_dir/npmrc"
        image="democracy-now-tv-frontend:$GITHUB_SHA"
        docker build -f deploy/frontend.Dockerfile --build-arg CORE_UPSTREAM=democracy-core:8080 --secret id=npmrc,src="$auth_dir/npmrc" --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.source=https://git.subcult.tv/subculture-collective/democracy-now-tv" -t "$image" .
        docker run --rm --network none --entrypoint nginx "$image" -t
    if: github.repository == 'subculture-collective/democracy-now-tv'
  mirror-gate:
    name: Mirror CI gate
    if: always() && github.repository == 'subculture-collective/democracy-now-tv'
    needs:
    - verify
    - image
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Require every verification job
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        python3 - <<'PY'
        import json, os
        results = json.loads(os.environ["RESULTS"])
        expected = {'verify', 'image'}
        assert set(results) == expected, results
        for name, result in results.items():
            assert result["result"] == "success", name + " did not pass"
        PY
