name: verify
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Main-branch verification only; GitHub deploys main (.github/workflows/deploy.yml).
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify with job-local pnpm
        run: |
          tool_dir=$(mktemp -d)
          trap 'rm -rf "$tool_dir"' EXIT
          npm install --prefix "$tool_dir" pnpm@10.33.0
          PATH="$tool_dir/node_modules/.bin:$PATH" make verify
